# Health Watch service definitions.
#
# Each entry becomes a GET /service/<name>/health endpoint.
# Path resolution: $HEALTH_WATCH_SERVICES_FILE env var, else this file
# (services.yaml in the project root), else the app refuses to start.
#
# Secrets can reference environment variables: ${VAR_NAME} or ${VAR_NAME:-default}.

services:
  - name: example-api
    type: http
    settings:
      url: https://httpbin.org/status/200
      method: GET
      timeout: 5
      expected_status: 200

  - name: redis-cache
    type: tcp
    settings:
      host: localhost
      port: 6379
      timeout: 3

  - name: primary-db
    type: postgres
    settings:
      host: localhost
      port: 5432
      username: postgres
      password: ${PRIMARY_DB_PASSWORD:-postgres}
      database: app_db
      timeout: 5

  - name: vector-store
    type: qdrant
    settings:
      host: localhost
      port: 6333             # optional, default 6333
      https: false            # optional, default false
      # api_key: ${QDRANT_API_KEY}   # optional, omit if auth is disabled
      collection: documents   # optional; omit to just check the API is up
      timeout: 5

  - name: worker-container
    type: docker
    settings:
      container: worker             # container name or ID
      # base_url: unix://var/run/docker.sock  # optional; defaults to the local Docker environment
      expect_running: true            # optional, default true
      timeout: 5
