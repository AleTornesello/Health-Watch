# Health Watch service definitions.
#
# Each entry becomes a GET /service/<name>/health endpoint.
# Path resolution: $HEALTH_WATCH_SERVICES_FILE env var, else this file
# (services.yaml in the project root), else the app refuses to start.
#
# Secrets can reference environment variables: ${VAR_NAME} or ${VAR_NAME:-default}.

services:
  - name: example-api
    type: http
    settings:
      url: https://httpbin.org/status/200
      method: GET
      timeout: 5
      expected_status: 200

  - name: redis-cache
    type: tcp
    settings:
      host: localhost
      port: 6379
      timeout: 3

  - name: primary-db
    type: postgres
    settings:
      host: localhost
      port: 5432
      username: postgres
      password: ${PRIMARY_DB_PASSWORD:-postgres}
      database: app_db
      timeout: 5
